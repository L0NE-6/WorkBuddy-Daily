name: 🌱 WorkBuddy Daily

on:
  schedule:
    # 北京时间 07:00 / 12:00 / 23:30（GitHub cron 用 UTC，北京时间 = UTC+8）
    - cron: "0 23 * * *"     # 07:00
    - cron: "0 4 * * *"      # 12:00
    - cron: "30 15 * * *"    # 23:30
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write

concurrency:
  group: workbuddy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # mp 对话任务按真人节奏上报（每条 45s±10s），账号多时耗时更长
    env:
      TZ: Asia/Shanghai   # runner 默认 UTC：不加会把日志时间与补签日期算错一天
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run WorkBuddy
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WORKBUDDY_TASKS: ${{ secrets.WORKBUDDY_TASKS }}
          WORKBUDDY_SKIP_TASKS: ${{ secrets.WORKBUDDY_SKIP_TASKS }}
          WORKBUDDY_MP_GAP: ${{ secrets.WORKBUDDY_MP_GAP }}
        run: python workbuddy_daily.py

      # ⚠️ 仅在【私有仓库】中持久化令牌状态；公开仓库会跳过，避免 RT 泄露
      - name: Persist token state (private repo only)
        if: always() && github.event.repository.private == true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wb_refresh_tokens.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "令牌状态无变化"
          else
            git commit -m "chore: 更新令牌状态 [skip ci]"
            git push
          fi
